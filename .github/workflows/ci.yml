name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer validate --strict
      - run: composer audit --no-dev

  lint:
    name: Lint - ${{ matrix.tool.name }}
    runs-on: ubuntu-latest
    needs: [security]
    strategy:
      fail-fast: false
      matrix:
        tool:
          - { name: Pint, command: lint:pint }
          - { name: PHPCS, command: lint:phpcs }
          - { name: PHPStan, command: lint:phpstan }
          - { name: PHPMD, command: lint:phpmd }
          - { name: PHP-CS-Fixer, command: lint:cs }
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer ${{ matrix.tool.command }}

  tests-matrix:
    name: Tests (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
            coverage: true
          - laravel: '13'
            testbench: '^11.0'
            coverage: false
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: jooservices_activities_ci
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
      - uses: ramsey/composer-install@v4
      - name: Require Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0"
          composer require --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction
      - name: Run tests with coverage
        if: matrix.coverage
        run: composer test:coverage
      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: composer test

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [tests-matrix]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.tests-matrix.result }}" != "success" ]; then
            echo "::error::Tests matrix did not succeed"
            exit 1
          fi
