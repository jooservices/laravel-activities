name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer validate --strict
      - run: composer audit --no-dev

  lint:
    name: Lint - ${{ matrix.tool.name }}
    runs-on: ubuntu-latest
    needs: [security]
    strategy:
      fail-fast: false
      matrix:
        tool:
          - { name: Pint, command: lint:pint }
          - { name: PHPCS, command: lint:phpcs }
          - { name: PHPStan, command: lint:phpstan }
          - { name: PHPMD, command: lint:phpmd }
          - { name: PHP-CS-Fixer, command: lint:cs }
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer ${{ matrix.tool.command }}

  tests-matrix:
    name: Tests (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: jooservices_activities_ci
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer test
