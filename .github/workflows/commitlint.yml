name: Commitlint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 10
    env:
      DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted Commitlint configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-config
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/commitlint.config.mjs
            .github/commitlint/package.json
            .github/commitlint/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Reject mixed-authorship Dependabot PR
        if: env.DEPENDABOT_PR == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            if (commits.length !== pullRequest.commits) {
              core.setFailed(
                `Could not validate all Dependabot commits: expected ${pullRequest.commits}, fetched ${commits.length}.`,
              );
              return;
            }

            const invalidCommits = commits.filter(
              ({ author }) => author?.login !== 'dependabot[bot]',
            );

            if (invalidCommits.length > 0) {
              const details = invalidCommits
                .map(({ sha, author }) => `${sha.slice(0, 7)} (${author?.login ?? 'unknown'})`)
                .join(', ');
              core.setFailed(
                `Dependabot PRs must contain only Dependabot-authored commits: ${details}`,
              );
            }

      - name: Install trusted Commitlint CLI
        run: npm ci --ignore-scripts --prefix trusted-config/.github/commitlint

      - name: Validate all PR commits
        run: |
          trusted-config/.github/commitlint/node_modules/.bin/commitlint \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --config trusted-config/.github/commitlint.config.mjs \
            --verbose
