name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mongodb
      - uses: ramsey/composer-install@v4
      - run: composer check
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
